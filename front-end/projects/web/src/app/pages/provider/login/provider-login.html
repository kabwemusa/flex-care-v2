<section class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <span class="material-symbols-rounded text-violet-600" style="font-size: 40px">local_hospital</span>
      <h1 class="text-xl font-bold text-gray-900 mt-2">Provider Portal</h1>
      <p class="text-gray-500 text-sm">Sign in with your API credentials</p>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 p-6">
      <!-- Error -->
      @if (error()) {
        <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-4">
          <p class="text-sm text-red-600">{{ error() }}</p>
        </div>
      }

      <!-- Form -->
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">API Key</label>
          <input
            type="text"
            [value]="apiKey()"
            (input)="apiKey.set(inputValue($event))"
            placeholder="fc_xxxxxxxxxxxxxxxx"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">API Secret</label>
          <input
            type="password"
            [value]="apiSecret()"
            (input)="apiSecret.set(inputValue($event))"
            placeholder="••••••••••••••••"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
          />
        </div>

        <button
          (click)="login()"
          [disabled]="loading() || !apiKey() || !apiSecret()"
          class="w-full bg-violet-600 text-white font-medium text-sm py-2.5 rounded-lg hover:bg-violet-700 transition-colors disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></span>
          }
          Sign In
        </button>
      </div>

      <!-- Help Text -->
      <div class="mt-5 pt-4 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">
          API credentials are issued after your facility is approved.
        </p>
        <a routerLink="/provider/register" class="text-xs text-violet-600 hover:text-violet-700 font-medium mt-1 inline-block">
          Register your facility →
        </a>
      </div>
    </div>
  </div>
</section>
