<!-- Toast container — fixed bottom-right, renders all active toasts -->
<div
  role="region"
  aria-live="polite"
  aria-label="Notifications"
  class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none"
>
  @for (t of toast.toasts(); track trackById($index, t)) {
    <div
      [ngClass]="containerClasses(t.type)"
      class="
        pointer-events-auto flex items-start gap-3 rounded-xl shadow-lg shadow-gray-200/80
        px-4 py-3 transition-all duration-300 fc-slide-up
      "
      role="alert"
    >
      <!-- Icon -->
      <span
        [ngClass]="iconClasses(t.type)"
        class="material-symbols-rounded text-[22px] shrink-0 mt-0.5"
        aria-hidden="true"
      >{{ iconFor(t.type) }}</span>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        @if (t.title) {
          <p class="text-sm font-semibold text-gray-900 leading-tight">{{ t.title }}</p>
        }
        <p class="text-sm text-gray-600 leading-snug">{{ t.message }}</p>
      </div>

      <!-- Dismiss -->
      <button
        (click)="dismiss(t.id)"
        class="shrink-0 text-gray-400 hover:text-gray-600 transition-colors -mr-1 -mt-0.5"
        aria-label="Dismiss notification"
        type="button"
      >
        <span class="material-symbols-rounded text-[18px]">close</span>
      </button>
    </div>
  }
</div>
