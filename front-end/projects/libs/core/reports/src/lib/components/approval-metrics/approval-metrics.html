<div class="space-y-6">
  <!-- KPI Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <lib-kpi-card
      label="Pending"
      [value]="metrics()?.summary?.pending ?? 0"
      icon="hourglass_empty"
      color="warning"
      [loading]="store.isLoadingApprovals()"
    />
    <lib-kpi-card
      label="Approved"
      [value]="metrics()?.summary?.approved ?? 0"
      icon="check_circle"
      color="success"
      [loading]="store.isLoadingApprovals()"
    />
    <lib-kpi-card
      label="Rejected"
      [value]="metrics()?.summary?.rejected ?? 0"
      icon="cancel"
      color="danger"
      [loading]="store.isLoadingApprovals()"
    />
    <lib-kpi-card
      label="Avg Processing Days"
      [value]="metrics()?.summary?.avg_processing_days ?? 0"
      icon="schedule"
      subtitle="Time to complete"
      [loading]="store.isLoadingApprovals()"
    />
  </div>

  <!-- Charts Row 1 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Status Distribution -->
    <lib-chart-container
      title="Status Distribution"
      subtitle="Current approval status breakdown"
      [loading]="store.isLoadingApprovals()"
      [empty]="!statusChartSeries().length"
    >
      <apx-chart
        [series]="statusChartSeries()"
        [labels]="statusChartLabels()"
        [colors]="statusChartColors()"
        [chart]="{ type: 'donut', height: 320 }"
        [plotOptions]="donutChartOptions.plotOptions"
        [dataLabels]="donutChartOptions.dataLabels"
        [legend]="donutChartOptions.legend"
        [responsive]="donutChartOptions.responsive"
      />
    </lib-chart-container>

    <!-- Approval Trend -->
    <lib-chart-container
      title="Approval Trend"
      subtitle="Actions over time"
      [loading]="store.isLoadingApprovals()"
      [empty]="!trendChartSeries().length"
    >
      <apx-chart
        [series]="trendChartSeries()"
        [chart]="{ type: 'area', height: 320, stacked: false }"
        [colors]="trendChartColors"
        [xaxis]="trendChartXAxis()"
        [stroke]="areaChartOptions.stroke"
        [fill]="areaChartOptions.fill"
        [dataLabels]="areaChartOptions.dataLabels"
        [legend]="areaChartOptions.legend"
        [grid]="areaChartOptions.grid"
        [tooltip]="areaChartOptions.tooltip"
      />
    </lib-chart-container>
  </div>

  <!-- Charts Row 2 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Processing Time by Entity Type -->
    <lib-chart-container
      title="Processing Time by Type"
      subtitle="Average days to complete by entity type"
      [loading]="store.isLoadingApprovals()"
      [empty]="!entityTypeChartSeries().length"
    >
      <apx-chart
        [series]="entityTypeChartSeries()"
        [chart]="{ type: 'bar', height: 320 }"
        [colors]="[chartColors.primary]"
        [xaxis]="entityTypeXAxis()"
        [plotOptions]="barChartOptions.plotOptions"
        [dataLabels]="daysDataLabels"
        [grid]="barChartOptions.grid"
        [tooltip]="barChartOptions.tooltip"
      />
    </lib-chart-container>

    <!-- Approver Performance -->
    <lib-chart-container
      title="Top Approvers"
      subtitle="Most active approvers this period"
      [loading]="store.isLoadingApprovals()"
      [empty]="!approverChartSeries().length"
    >
      <apx-chart
        [series]="approverChartSeries()"
        [chart]="{ type: 'bar', height: 320, stacked: true }"
        [colors]="[chartColors.success, chartColors.danger]"
        [xaxis]="approverXAxis()"
        [yaxis]="approverYAxis()"
        [plotOptions]="{ bar: { horizontal: true, barHeight: '60%', borderRadius: 4 } }"
        [dataLabels]="horizontalBarOptions.dataLabels"
        [grid]="horizontalBarOptions.grid"
        [legend]="{ position: 'top' }"
      />
    </lib-chart-container>
  </div>

  <!-- Bottlenecks Table -->
  @if (metrics()?.bottlenecks?.length) {
  <lib-chart-container
    title="Workflow Bottlenecks"
    subtitle="Steps with longest processing times"
    [loading]="store.isLoadingApprovals()"
    minHeight="auto"
  >
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead>
          <tr class="bg-gray-50">
            <th
              class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Workflow
            </th>
            <th
              class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Step
            </th>
            <th
              class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Avg Days
            </th>
            <th
              class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Pending
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          @for (item of metrics()?.bottlenecks ?? []; track item.step_name) {
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-gray-900">{{ item.workflow_name }}</td>
            <td class="px-4 py-3 text-sm text-gray-600">{{ item.step_name }}</td>
            <td
              class="px-4 py-3 text-sm text-right font-medium"
              [class.text-red-600]="item.avg_days_at_step > 3"
              [class.text-amber-600]="item.avg_days_at_step > 1 && item.avg_days_at_step <= 3"
              [class.text-green-600]="item.avg_days_at_step <= 1"
            >
              {{ item.avg_days_at_step | number : '1.1-1' }}
            </td>
            <td class="px-4 py-3 text-sm text-right text-gray-600">{{ item.pending_count }}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </lib-chart-container>
  }
</div>
