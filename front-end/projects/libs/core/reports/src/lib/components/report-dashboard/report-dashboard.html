<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Reports Dashboard</h1>
      <p class="text-gray-500 mt-1">Monitor key metrics and make data-driven decisions</p>
    </div>
    <div class="flex items-center gap-3">
      <lib-date-range-picker
        [fromDate]="store.filters().from_date"
        [toDate]="store.filters().to_date"
        (dateRangeChange)="onDateRangeChange($event)"
      />
      <button mat-flat-button color="primary" (click)="refreshAll()">
        <mat-icon fontSet="material-symbols-rounded">refresh</mat-icon>
        Refresh
      </button>
    </div>
  </div>

  <!-- Summary KPI Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <!-- Approval KPIs -->
    <lib-kpi-card
      label="Pending Approvals"
      [value]="store.pendingApprovals()"
      icon="hourglass_empty"
      color="warning"
      [loading]="store.isLoadingSummary()"
    />
    <lib-kpi-card
      label="Approval Rate"
      [value]="store.approvalRate()"
      format="percent"
      icon="thumb_up"
      color="success"
      [loading]="store.isLoadingSummary()"
    />
    <!-- Policy KPIs -->
    <lib-kpi-card
      label="Active Policies"
      [value]="store.activePolicies()"
      icon="policy"
      color="info"
      [loading]="store.isLoadingSummary()"
    />
    <lib-kpi-card
      label="Total Premium"
      [value]="store.totalPremium()"
      format="currency"
      icon="payments"
      color="success"
      [loading]="store.isLoadingSummary()"
    />
  </div>

  <!-- Second Row KPIs -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <lib-kpi-card
      label="Total Outstanding"
      [value]="store.totalOutstanding()"
      format="currency"
      icon="account_balance"
      color="warning"
      [loading]="store.isLoadingSummary()"
    />
    <lib-kpi-card
      label="Collection Rate"
      [value]="store.collectionRate()"
      format="percent"
      icon="trending_up"
      color="success"
      [loading]="store.isLoadingSummary()"
    />
    <lib-kpi-card
      label="Overdue Amount"
      [value]="store.overdueAmount()"
      format="currency"
      icon="warning"
      color="danger"
      [loading]="store.isLoadingSummary()"
    />
    <lib-kpi-card
      label="For Renewal"
      [value]="store.forRenewalCount()"
      icon="autorenew"
      color="info"
      subtitle="Expiring in 60 days"
      [loading]="store.isLoadingSummary()"
    />
  </div>

  <!-- Tabbed Content -->
  <mat-tab-group
    (selectedIndexChange)="onTabChange($event)"
    [selectedIndex]="selectedTab()"
    class="report-tabs"
  >
    <mat-tab label="Approvals">
      <ng-template matTabContent>
        <div class="pt-6">
          <lib-approval-metrics />
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Policies">
      <ng-template matTabContent>
        <div class="pt-6">
          <lib-policy-analytics />
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Billing">
      <ng-template matTabContent>
        <div class="pt-6">
          <lib-billing-reports />
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
